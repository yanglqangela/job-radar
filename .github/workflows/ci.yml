name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cross-language crypto test (Node decrypts Python envelope)
        run: node --experimental-strip-types tests/test_crypto_webcrypto.mjs

      - name: Python tests
        run: python -m pytest tests -q

      - name: Portfolio data check
        run: python scripts/build_portfolio.py --check

      - name: Frontend build
        working-directory: web
        run: npm ci && npm run build
