name: daily

on:
  schedule:
    # GitHub cron 使用 UTC：01:17 UTC = 09:17 北京时间（避开整点拥堵）
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只跑管线，不写文件、不推送"
        type: boolean
        default: false
      push:
        description: "推送企业微信"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write # 需要显式触发 deploy（GITHUB_TOKEN 的 push 不会触发其他 workflow）

concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-chat' }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.push }}" = "false" ]; then ARGS="$ARGS --no-push"; fi
          python scripts/daily_jobs.py $ARGS

      - name: Commit encrypted digest
        # 即使管线返回非零（例如微信推送失败），只要文件已更新也要提交
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in web/public/data/digest.enc.json web/public/data/meta.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "没有数据变更"
            exit 0
          fi
          git commit -m "chore(data): daily digest $(date -u +%F) [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "已提交"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "提交失败：请检查分支保护规则"
          exit 1

      - name: Trigger Pages deploy
        # GITHUB_TOKEN 推送的提交不会触发 deploy.yml，必须显式 dispatch
        if: ${{ always() && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
